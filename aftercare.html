<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>건강진단 사후관리 출력 프로그램</title>
<style>
*{box-sizing:border-box}
body{font-family:"Noto Sans CJK KR","Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;margin:0;background:#e9ecf0;color:#1d1d1f;font-size:14px}
/* ---------- 편집 화면 ---------- */
.bar{position:sticky;top:0;z-index:5;background:#1d3557;color:#fff;padding:8px 10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.bar b{margin-right:6px}
.bar select,.bar button,.bar label.btn{font:inherit;font-size:13px;padding:6px 10px;border-radius:6px;border:0;cursor:pointer}
.bar button,.bar label.btn{background:#fff;color:#1d3557}
.bar button.pri{background:#f4a261;color:#1d1d1f;font-weight:700}
.bar button.del{background:#e76f51;color:#fff}
.wrap{display:flex;gap:12px;padding:12px;align-items:flex-start}
.form{width:420px;flex-shrink:0;background:#fff;border-radius:10px;padding:12px;max-height:calc(100vh - 70px);overflow:auto;position:sticky;top:58px}
.form h3{font-size:14px;margin:14px 0 6px;color:#1d3557;border-bottom:1px solid #dde1e6;padding-bottom:3px}
.form h3:first-child{margin-top:0}
.row{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:6px}
.row.three{grid-template-columns:1fr 1fr 1fr}
.row.one{grid-template-columns:1fr}
.f label{display:block;font-size:11.5px;color:#555;margin-bottom:2px}
.f input,.f select,.f textarea{width:100%;font:inherit;font-size:13px;padding:5px 6px;border:1px solid #c5ccd4;border-radius:5px}
.f textarea{min-height:60px;resize:vertical}
.hz{border:1px solid #dde1e6;border-radius:6px;padding:6px;margin-bottom:6px;background:#fafbfc}
.hz .row{margin-bottom:4px}
.small-btn{font:inherit;font-size:12px;padding:4px 8px;border:1px solid #c5ccd4;border-radius:5px;background:#fff;cursor:pointer}
.hear{display:grid;grid-template-columns:34px repeat(6,1fr);gap:3px;align-items:center;font-size:11px}
.hear input{padding:3px;font-size:12px;text-align:center}
.photos-in{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.photos-in .ph{border:1px dashed #b8bec6;border-radius:6px;padding:4px;font-size:11px}
.photos-in img{width:100%;height:70px;object-fit:cover;border-radius:4px;display:block}
.hint{font-size:11.5px;color:#777;margin:4px 0}
.preview{flex:1;overflow:auto}
.scaler{transform-origin:top left}
/* ---------- A4 출력 ---------- */
.page{width:210mm;height:297mm;padding:9mm 10mm;background:#fff;margin:0 auto 14px;box-shadow:0 2px 10px rgba(0,0,0,.15);overflow:hidden;position:relative;font-size:9.3pt;line-height:1.38}
.page table{border-collapse:collapse;width:100%}
.page td,.page th{border:1px solid #b8bec6;padding:3px 5px;vertical-align:middle}
.page th{background:#eef1f5;font-weight:600;white-space:nowrap}
.ph1{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2.5px solid #1d3557;padding-bottom:5px;margin-bottom:7px}
.ph1 h1{font-size:15pt;margin:0}
.sub{font-size:8.3pt;color:#555}
.sec{font-size:10.3pt;font-weight:700;color:#1d3557;margin:8px 0 4px;border-left:4px solid #1d3557;padding-left:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.verdict{display:flex;gap:6px}
.vbox{flex:1;border:1.5px solid #b8bec6;border-radius:4px;padding:5px;text-align:center}
.vbox .k{font-size:7.8pt;color:#555}.vbox .v{font-size:16pt;font-weight:800;line-height:1.25}.vbox .d{font-size:7.4pt;color:#333}
.vbox.ok{border-color:#7fb88b;background:#f1f9f2}.vbox.ok .v{color:#2a7a3b}
.vbox.warn{border-color:#e9a23b;background:#fff8ec}.vbox.warn .v{color:#b86e00}
.vbox.bad{border-color:#c0392b;background:#fdeeee}.vbox.bad .v{color:#c0392b}
.vbox .v.txt{font-size:10.5pt;padding:4px 0}
.tag{display:inline-block;padding:0 6px;border-radius:3px;font-weight:700;font-size:8.5pt}
.tA{background:#e3f3e6;color:#2a7a3b}.tC{background:#fff1d6;color:#b86e00}.tD{background:#fde2df;color:#c0392b}.tX{background:#eceef1;color:#555}
.mbar{position:relative;height:13px;background:#f1f3f6;border-radius:2px;margin:2px 0}
.mbar i{position:absolute;left:0;top:0;bottom:0;border-radius:2px}
.mbar b{position:absolute;top:-2px;bottom:-2px;width:2px;background:#1d3557}
.mbar span{position:absolute;right:4px;top:-1px;font-size:8pt;font-weight:700}
.lbl{display:flex;justify-content:space-between;font-size:8pt}
.page ul{margin:2px 0;padding-left:16px}.page li{margin:1.5px 0}
.mini{font-size:7.5pt;color:#666}
.foot{position:absolute;left:10mm;right:10mm;bottom:6mm;font-size:7.3pt;color:#888;display:flex;justify-content:space-between;border-top:1px solid #e1e4e8;padding-top:3px}
/* page2 */
.dz{display:grid;grid-template-columns:62px 1fr 1fr;gap:8px;border:1.5px solid #dde1e6;border-radius:6px;padding:6px 8px;margin-bottom:6px;align-items:start}
.dz.hi{border-color:#e9a23b;background:#fffaf1}.dz.hd{border-color:#c0392b;background:#fff5f4}
.dz .ic{text-align:center;font-size:8pt;font-weight:700}
.dz h4{margin:0 0 2px;font-size:10pt}
.dz .dis{font-weight:700;color:#8a2c1f}
.dz .sym{font-size:8pt;color:#555;margin-top:2px}
.dz .pv{font-size:8.6pt}
.dz .pv ul{padding-left:14px}
.ppe{border:1.5px solid #1d3557;border-radius:6px;padding:6px 8px;margin-top:6px}
.ppe h4{margin:0 0 4px;font-size:10pt;color:#1d3557}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.step{text-align:center;font-size:8.2pt;line-height:1.3}
.step svg{width:100%;height:auto;max-height:68px;background:#f5f7fa;border-radius:5px}
.step .n{display:inline-block;width:15px;height:15px;border-radius:50%;background:#1d3557;color:#fff;font-size:8pt;line-height:15px;margin-right:2px}
.ppe .care{font-size:8pt;color:#444;margin-top:4px;background:#f5f7fa;border-radius:4px;padding:3px 6px}
.ppes{display:grid;gap:6px;margin-top:6px}
.ppes .ppe{margin-top:0}
.ppes.n3{grid-template-columns:1fr 1fr}
.ppes.n3 .steps{grid-template-columns:1fr 1fr;gap:4px}
.ppes.n3 .step{font-size:7.6pt}
.ppes.n3 .step svg{max-height:44px}
.ppes.n3 .ppe h4{font-size:9.3pt}
.ppes.n3 .care{font-size:7.3pt}
.edu{margin-top:8px;border:1.5px solid #1d3557;border-radius:6px;padding:6px 8px;page-break-inside:avoid}
.edu td,.edu th{padding:4px 5px;height:7mm}
.edutxt{font-size:8.6pt;background:#f5f7fa;border-radius:4px;padding:4px 6px;margin-bottom:5px}
.esign{text-align:right;font-size:9pt;margin-top:6px}
.roomy .edu{margin-top:14px}.roomy .edu td,.roomy .edu th{height:9mm}
.tight2 .edu td,.tight2 .edu th{height:5.5mm;padding:2px 4px}.tight2 .edutxt{font-size:7.8pt}
.p2{padding-bottom:13mm}
.tight4 .dz .sym{display:none}.tight4 .ppe .care{display:none}.tight4 .dz .ic svg{max-height:34px}.tight4 .edu td,.tight4 .edu th{height:5mm}
.tight5 .dz .pv li:nth-child(4){display:none}.tight5 .step svg{max-height:24px}.tight5 .dz h4{font-size:9pt}
.roomy .dz{padding:12px 14px;grid-template-columns:96px 1fr 1fr;gap:12px;margin-bottom:10px}.roomy .dz .ic svg{width:86px}.roomy .dz h4,.roomy .dz .pv h4{font-size:11.5pt!important}.roomy .dz .dis{font-size:11pt}.roomy .dz .sym,.roomy .dz .pv{font-size:10pt}.roomy .dz .pv li{margin:4px 0}
.roomy .ppe{padding:10px 12px;margin-top:10px}.roomy .ppe h4{font-size:12.5pt}.roomy .step svg{max-height:130px}.roomy .step{font-size:10pt}.roomy .step .n{width:18px;height:18px;line-height:18px;font-size:9pt}.roomy .care{font-size:9.5pt;padding:5px 8px}
.tight1 .dz{padding:4px 6px;margin-bottom:4px}.tight1 .dz .pv{font-size:8pt}.tight1 .step svg{max-height:36px}
.tight2 .dz .sym:not(.law){display:none}.tight2 .dz svg{max-height:40px}
.tight3 .ppes.n3 .steps{grid-template-columns:repeat(4,1fr)}.tight3 .step svg{max-height:28px}.tight3 .step{font-size:7pt}
/* page3 */
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pbox{border:1px solid #b8bec6;border-radius:5px;padding:4px;height:88mm;display:flex;flex-direction:column}
.pbox .im{flex:1;display:flex;align-items:center;justify-content:center;background:#f5f7fa;border-radius:3px;overflow:hidden}
.pbox img{max-width:100%;max-height:100%;object-fit:contain}
.pbox .cap{font-size:8.5pt;padding:3px 2px 0;min-height:16px}
.pbox .empty{color:#aaa;font-size:9pt}
.pgrid.one .pbox{height:180mm;grid-column:span 2}
.pgrid.two .pbox{height:120mm}
.notebox{border:1px solid #b8bec6;border-radius:5px;padding:6px 8px;min-height:28mm;white-space:pre-wrap;font-size:9pt}
@media (max-width:900px){.wrap{flex-direction:column}.form{width:100%;position:static;max-height:none}}
@media print{
  @page{size:A4;margin:0}
  body{background:#fff}
  .bar,.form,.noprint{display:none!important}
  .wrap{padding:0;display:block}
  .scaler{transform:none!important;height:auto!important}
  .page{margin:0;box-shadow:none;page-break-after:always;break-after:page}
  .page:last-child{page-break-after:auto;break-after:auto}
}
</style></head><body>

<div class="bar">
  <b>사후관리 출력</b>
  <select id="sel" title="근로자 선택"></select>
  <button onclick="addWorker()">+ 새 근로자</button>
  <button class="del" onclick="delWorker()">삭제</button>
  <button onclick="workers.push(...demo());cur=workers.length-3;save();fillSel();renderForm();renderPages()">예시 불러오기</button>
  <button onclick="exportJSON()">백업 저장</button>
  <label class="btn">백업 불러오기<input type="file" accept=".json" hidden onchange="importJSON(this)"></label>
  <button class="pri" onclick="window.print()">인쇄 / PDF 저장</button>
</div>

<div class="wrap">
  <div class="form" id="form"></div>
  <div class="preview"><div class="scaler" id="scaler"><div id="pages"></div></div></div>
</div>

<script>
/* ===================== 유해인자 라이브러리 ===================== */
const HZ = {
 dust:{name:'광물성 분진',icon:'lungs',kw:['분진','광물','유리규산','석면','시멘트분진'],
  dis:['진폐증(규폐증)','만성폐쇄성폐질환(COPD)','폐암(결정형 유리규산)'],
  sym:'기침·가래, 계단 오를 때 숨참, 폐기능 저하',

  ppe:'mask',point:'방진마스크(특급/1급) 지급·착용과 밀착도를 점검하고, 습식작업·집진 여부를 확인합니다.'},
 noise:{name:'소음',icon:'ear',kw:['소음'],
  dis:['소음성 난청','이명(귀울림)','수면장애·혈압 상승'],
  sym:'대화가 잘 안 들림, 작업 후 귀 먹먹함·삐 소리',

 uv:{name:'자외선(유해광선)',icon:'sun',kw:['자외선','유해광선','광선'],
  dis:['광각막염(눈 화상)','백내장·익상편','일광화상·피부암'],
  sym:'눈 따가움·눈물, 시야 흐림, 피부 붉어짐',

  ppe:'goggles',point:'옥외작업 시 보안경·긴소매·차양 착용과 자외선 차단제 사용을 지도합니다.'},

 heat:{name:'고열(폭염)',icon:'thermo',

 ${line(L,'#2563a8',1)}${L.map((v,i)=>v==null?'':`<path d="M${X[i]-3.5} ${Y(v)-3.5}l7 7M${X[i]+3.5} ${Y(v)-3.5}l-7 7" stroke="#2563a8" stroke-width="1.8"/>`).join('')}

 <div class="mini" style="margin-top:3px">${[w.fvc&&`FVC ${esc(w.fvc)} L`,w.fev1&&`FEV1 ${esc(w.fev1)} L`,w.cxr&&`흉부방사선 ${esc(w.cxr)}`].filter(Boolean).join(' · ')} · ▮ 기준선</div>`}

function points(w){const P=[],d=dday(w.nextDate);
 if(d!=null&&d<0)P.push(`<b>추적검사:</b> 기한(${esc(w.nextDate)})이 ${-d}일 지났습니다. 시행 여부와 결과를 확인하고, 미시행 시 일정을 잡습니다.`);
 else if(d!=null&&d<=60)P.push(`<b>추적검사:</b> ${esc(w.nextDate)} (D-${d}) 예정 — 일정을 안내합니다.`);
 const ab=sorted(w).filter(f=>f.grade!=='A'),ok=w.factors.filter(f=>f.grade==='A');
 ab.forEach(f=>P.push(`<b>${esc(f.label||HZ[f.key].name)} (${f.grade}):</b> ${HZ[f.key].point}`));
 if(ok.length)P.push(`<b>현재 정상(A):</b> ${ok.map(f=>esc(f.label||HZ[f.key].name)).join(', ')} — 보호구 착용을 유지하도록 지도합니다.`);
 if(w.smoking==='흡연')P.push('<b>금연 상담:</b> 흡연자입니다. 금연 프로그램(보건소 금연클리닉 등)을 안내합니다.');
 else if(w.smoking==='확인 필요'||!w.smoking)P.push('<b>흡연 여부:</b> 결과지 기재가 불명확하므로 상담 시 확인합니다.');
 const s=num(w.bpS),dd=num(w.bpD);if((s&&s>=140)||(dd&&dd>=90))P.push(`<b>혈압:</b> ${s}/${dd} mmHg로 높습니다. 재측정과 병원 진료를 권하고, 고소·중량 작업 시 주의합니다.`);
 if(w.other)P.push(`<b>기타 소견:</b> ${esc(w.other)}`);
 if(ab.some(f=>['dust','weld','solvent'].includes(f.key)))P.push('<b>증상 확인:</b> 기침·가래·숨참·두통 등 증상 유무를 묻고 기록합니다.');
 return P.slice(0,7)}

function page1(w){const g=worst(w),d=dday(w.nextDate),bmi=num(w.height)&&num(w.weight)?(w.weight/((w.height/100)**2)).toFixed(1):null;
 const basic=[w.bpS&&`<tr><th>혈압</th><td>${esc(w.bpS)}/${esc(w.bpD)} mmHg <span class="tag ${(+w.bpS>=140||+w.bpD>=90)?'tD':'tA'}">${(+w.bpS>=140||+w.bpD>=90)?'높음':'정상'}</span></td></tr>`,
  w.height&&`<tr><th>신장/체중</th><td>${esc(w.height)} cm / ${esc(w.weight)} kg${bmi?` (BMI ${bmi})`:''}</td></tr>`,
  w.gripL&&`<tr><th>악력 좌/우</th><td>${esc(w.gripL)} / ${esc(w.gripR)} kg</td></tr>`].filter(Boolean).join('');
 const sp=spiro(w),au=audiogram(w);
 return `<div class="page">${head(w,'건강진단 사후관리 상담지',`${esc(w.examType)} 건강진단 결과 요약`)}
 <table><tr><th>성명</th><td>${esc(w.name)}</td><th>나이/성별</th><td>${esc(w.age)} / ${esc(w.sex)}</td><th>사번</th><td>${esc(w.empno)||'—'}</td></tr>
 <tr><th>사업장</th><td colspan="3">${esc(w.company)}</td><th>작업부서</th><td>${esc(w.dept)}</td></tr>
 <tr><th>입사일</th><td>${esc(w.joinDate)}</td><th>1일 폭로</th><td>${w.hours?esc(w.hours)+'시간':''}</td><th>흡연</th><td>${esc(w.smoking)}</td></tr>
 <tr><th>유해인자</th><td colspan="5">${w.factors.map(f=>esc(f.label||HZ[f.key].name)).join(' · ')||'—'}</td></tr></table>
 <div class="sec">판정 요약</div>
 <div class="verdict">
  <div class="vbox ${boxc(g)}"><div class="k">건강관리구분</div><div class="v">${g||'—'}</div><div class="d">${GRADE[g]||''}</div></div>
  <div class="vbox ${w.fitness==='가'?'ok':w.fitness?'warn':''}"><div class="k">업무수행 적합여부</div><div class="v">${esc(w.fitness)||'—'}</div><div class="d">${FIT[w.fitness]||''}</div></div>
  <div class="vbox ${boxc(g)}"><div class="k">주요 소견</div><div class="v txt">${esc(w.mainFinding)||'특이소견 없음'}</div></div>
  <div class="vbox ${d==null?'':d<0?'bad':d<=60?'warn':'ok'}"><div class="k">추적검사 기한</div><div class="v txt">${esc(w.nextDate)||'해당 없음'}</div><div class="d"><b>${d==null?'':d<0?'기한 경과 — 시행 여부 확인':`D-${d}`}</b></div></div>
 </div>
 ${w.factors.length?`<div class="sec">유해인자별 판정 및 사후관리</div><table><tr><th>유해인자</th><th>구분</th><th>검진소견</th><th>사후관리조치</th></tr>
 ${sorted(w).map(f=>`<tr><td>${esc(f.label||HZ[f.key].name)}</td><td style="text-align:center"><span class="tag ${tagc(f.grade)}">${f.grade}</span></td><td>${esc(f.finding)}</td><td>${f.grade!=='A'?'<b>':''}${esc(f.action)}${f.grade!=='A'?'</b>':''}</td></tr>`).join('')}</table>`:''}
 <div class="grid2"><div>${sp}${basic?`<div class="sec">기본 측정</div><table>${basic}</table>`:''}</div><div>${au}</div></div>
 <div class="sec">상담 포인트 (보건관리자 확인용)</div><ul>${points(w).map(p=>`<li>${p}</li>`).join('')}</ul>
 ${foot(1)}</div>`}


function defGive(w){return [...new Set(w.factors.filter(f=>f.grade!=='A').map(f=>HZ[f.key].ppe))].filter(k=>PPE_ITEM[k]).map(k=>({name:PPE_ITEM[k],qty:''}))}
function giveList(w){if(!w.ppeGive||!w.ppeGive.length)w.ppeGive=defGive(w);return w.ppeGive}
function addGive(){giveList(W()).push({name:'',qty:''});save();renderForm();renderPages()}
function rmGive(i){W().ppeGive.splice(i,1);if(!W().ppeGive.length)W().ppeGive=[{name:'',qty:''}];save();renderForm();renderPages()}
function resetGive(){W().ppeGive=defGive(W());save();renderForm();renderPages()}
function eduBox(w){const rows=giveList(w).filter(g=>g.name||g.qty);const pad=Math.max(0,3-rows.length);
 return `<div class="edu"><div class="sec" style="margin-top:0">보호구 착용 교육 및 지급 확인</div>
 <div class="edutxt">${esc(w.eduText||EDU_TEXT)}</div>
 <table><tr><th style="width:15%">교육·지급일</th><td style="width:35%">${esc(w.eduDate)}</td><th style="width:15%">교육자</th><td>${esc(w.educator)} <span class="mini">(서명)</span></td></tr></table>
 <table style="margin-top:4px"><tr><th style="width:6%">No</th><th>보호구명</th><th style="width:12%">수량</th><th style="width:30%">수령자 서명</th></tr>
 ${rows.map((g,i)=>`<tr><td style="text-align:center">${i+1}</td><td>${esc(g.name)}</td><td style="text-align:center">${esc(g.qty)}</td><td></td></tr>`).join('')}
 ${Array.from({length:pad},(_,j)=>`<tr><td style="text-align:center">${rows.length+j+1}</td><td></td><td></td><td></td></tr>`).join('')}</table>
 <div class="esign">위 내용을 확인함 &nbsp; 근로자 성명: <u>&nbsp;${esc(w.name)||'&nbsp;'.repeat(16)}&nbsp;</u> &nbsp; (서명) ______________</div></div>`}
function page2(w){const fs=sorted(w).filter(f=>f.grade!=='A').slice(0,6);
 const ppes=[...new Set(fs.map(f=>HZ[f.key].ppe))];
 return `<div class="page p2 ${fs.length&&fs.length<=2?'roomy':''}">${head(w,'주의해야 할 직업성 질환과 예방법','검진 결과와 노출 유해인자 기준 · 예방 교육 자료(진단 아님)')}
 <div class="mini" style="margin-bottom:5px">이번 검진에서 <b>이상 소견이 있는 유해인자만</b> 판정이 높은 순서로 표시했습니다. <span class="tag tD">D</span> 유소견 <span class="tag tC">C</span> 요관찰 <span class="tag tX">R·U</span> 재검·판정불가</div>
 ${fs.length?fs.map(f=>{const h=HZ[f.key];return `<div class="dz ${/^D/.test(f.grade)?'hd':/^C/.test(f.grade)?'hi':''}">
  <div class="ic">${ICON[h.icon]}<div>${h.name}</div><span class="tag ${tagc(f.grade)}">${f.grade}</span></div>
  <div><h4>주의 질환</h4><div class="dis">${h.dis.join(' · ')}</div><div class="sym">● 이런 증상이 있으면 알리세요: ${h.sym}</div>${h.law?`<div class="sym law" style="color:#1d3557">● 기준: ${h.law}</div>`:''}${f.grade!=='A'?`<div class="sym" style="color:#b86e00">● 이번 검진: ${esc(f.finding)}</div>`:''}</div>
  <div class="pv"><h4 style="margin:0 0 2px;font-size:10pt">예방법</h4><ul>${h.prev.map(p=>`<li>${p}</li>`).join('')}</ul></div></div>`}).join(''):`<div class="dz" style="display:block;text-align:center;padding:14px"><b style="font-size:11pt;color:#2a7a3b">이번 검진에서 유해인자 관련 이상 소견이 없습니다.</b><div class="mini" style="margin-top:4px">${w.factors.length?'노출 유해인자: '+w.factors.map(f=>esc(f.label||HZ[f.key].name)).join(', ')+' — 현재 보호구 착용을 유지하세요.':'입력폼 ③에서 유해인자를 추가하세요.'}</div></div>`}
 ${ppes.length?`<div class="ppes n${Math.min(ppes.length,3)}">${ppes.map(k=>{const p=PPE[k];return `<div class="ppe"><h4>🦺 ${p.name}</h4><div class="steps">${p.steps.map((s,i)=>`<div class="step">${s[0]}<div><span class="n">${i+1}</span>${s[1]}</div></div>`).join('')}</div><div class="care">관리: ${p.care}</div></div>`}).join('')}</div>`:''}
 ${eduBox(w)}
 ${foot(2)}</div>`}

/* 2쪽이 넘치면 단계적으로 줄이기 */
function fitPage2(){const el=document.querySelector('.p2');if(!el)return;
 for(const c of ['tight1','tight2','tight3','tight4','tight5']){if(el.scrollHeight<=el.clientHeight+1)break;el.classList.add(c)}}

function page3(w){const ph=w.photos,cls=ph.length===1?'one':ph.length===2?'two':'';
 const boxes=(ph.length?ph:[{},{},{},{}]).map(p=>`<div class="pbox"><div class="im">${p.src?`<img src="${p.src}">`:'<span class="empty">사진 첨부</span>'}</div><div class="cap">${esc(p.cap||'')}</div></div>`).join('');
 return `<div class="page">${head(w,'근로자 건강상담 기록','사후관리 상담 사진 첨부')}
 <table><tr><th>상담일</th><td>${esc(w.consultDate)}</td><th>상담자</th><td>${esc(w.counselor)}</td><th>장소</th><td>${esc(w.place)}</td></tr>
 <tr><th>대상자</th><td>${esc(w.name)}</td><th>부서</th><td>${esc(w.dept)}</td><th>판정</th><td>${worst(w)} ${GRADE[worst(w)]?'('+GRADE[worst(w)]+')':''}</td></tr></table>
 <div class="sec">상담 사진</div><div class="pgrid ${cls}">${boxes}</div>
 <div class="sec">상담 내용 및 조치</div><div class="notebox">${esc(w.consultNote)}</div>
 <table style="margin-top:8px"><tr><th style="width:18%">근로자 확인</th><td style="height:12mm">(서명)</td><th style="width:18%">상담자 확인</th><td>(서명)</td></tr></table>
 ${foot(3)}</div>`}

function renderPages(){const w=W();const sc=document.getElementById('scaler');const t=sc.style.transform;sc.style.transform='none';document.getElementById('pages').innerHTML=w?page1(w)+page2(w)+page3(w):'';fitPage2();sc.style.transform=t;fit()}
function fit(){const pv=document.querySelector('.preview'),sc=document.getElementById('scaler'),pw=794;const s=Math.min(1,(pv.clientWidth-4)/pw);sc.style.transform=`scale(${s})`;sc.style.width=pw+'px';sc.style.height=(document.getElementById('pages').scrollHeight*s)+'px'}
window.addEventListener('resize',fit);

/* ===================== 목록·백업 ===================== */
function fillSel(){document.getElementById('sel').innerHTML=workers.map((w,i)=>`<option value="${i}" ${i==cur?'selected':''}>${esc(w.name||'(이름 없음)')} ${w.dept?'· '+esc(w.dept):''}</option>`).join('')}
document.getElementById('sel').onchange=e=>{cur=+e.target.value;renderForm();renderPages()};
function addWorker(){workers.push(blank());cur=workers.length-1;save();fillSel();renderForm();renderPages()}
function delWorker(){if(!confirm(`'${W().name||'이 근로자'}' 기록을 삭제할까요?`))return;workers.splice(cur,1);if(!workers.length)workers.push(blank());cur=0;save();fillSel();renderForm();renderPages()}
function exportJSON(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(workers)],{type:'application/json'}));a.download=`사후관리_백업_${new Date().toISOString().slice(0,10)}.json`;a.click()}
function importJSON(inp){const r=new FileReader();r.onload=()=>{try{workers=JSON.parse(r.result);cur=0;save();fillSel();renderForm();renderPages()}catch(e){alert('백업 파일을 읽을 수 없습니다.')}};r.readAsText(inp.files[0])}

load();fillSel();renderForm();renderPages();
const q=new URLSearchParams(location.search).get('w');if(q){cur=+q;fillSel();renderForm();renderPages()}
</script>
</body></html>
