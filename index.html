<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&family=Montserrat:wght@500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#fff;color:#16262b;font-family:'Noto Sans KR','Malgun Gothic',sans-serif;word-break:keep-all}
.wrap{max-width:1120px;margin:0 auto;padding:44px 40px 28px;min-height:100vh;display:flex;flex-direction:column;justify-content:center}
header{display:flex;flex-direction:column;align-items:center;text-align:center;margin-bottom:40px}
.brand{display:flex;align-items:center;gap:12px}
header h1{margin:0;font-size:44px;font-weight:800;letter-spacing:-1.2px;color:#147285;line-height:1.2}
header .en{margin:10px 0 0;font-family:Montserrat,sans-serif;font-size:14px;letter-spacing:3.5px;color:#147285;line-height:1.5}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
a.tile{display:flex;flex-direction:column;align-items:center;gap:16px;min-width:0;padding:34px 12px;background:#fff;border:1px solid #dcebef;border-radius:20px;color:#16262b;text-decoration:none;text-align:center;transition:border-color .2s,box-shadow .2s,transform .2s}
a.tile:hover{border-color:#147285;box-shadow:0 8px 24px rgba(20,114,133,.12);transform:translateY(-2px)}
a.tile:focus-visible{outline:3px solid #7fcde0;outline-offset:3px}
.ic{flex:none;width:72px;height:72px;border-radius:22px;background:#e6f5f8;display:flex;align-items:center;justify-content:center}
.t{font-size:18px;font-weight:700;letter-spacing:-.4px;line-height:1.35;overflow-wrap:anywhere}
.note{margin:32px 0 0;font-size:12.5px;line-height:1.6;color:#8a9692;text-align:center}
@media(max-width:1000px){.wrap{padding:28px 20px 22px}.grid{gap:12px}a.tile{padding:24px 8px;gap:12px}.ic{width:60px;height:60px;border-radius:18px}.ic svg{width:32px;height:32px}.t{font-size:16px}header h1{font-size:36px}header{margin-bottom:28px}}
@media(max-width:640px){.wrap{justify-content:flex-start}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}header h1{font-size:30px}header .en{font-size:11px;letter-spacing:2.5px}.brand svg{width:26px;height:26px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head>
